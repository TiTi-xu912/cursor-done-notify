name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\hooks.ps1
          Push-Location proto\buddy-rs
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Package
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\package.ps1 -Version $env:TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\package.ps1 -Version $env:TAG -Engine rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\relay-rs.ps1 -Relay ".\dist\cursor-done-notify-$($env:TAG)-rust\hook-relay.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' | ForEach-Object { $_.FullName })
          gh release create $env:TAG @zips --title $env:TAG --generate-notes
