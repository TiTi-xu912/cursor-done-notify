name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run state and installer tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\hooks.ps1

      - name: Compile with warnings enabled
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cursor-done-notify-build'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) {
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          & $csc /nologo /warn:4 /target:exe "/out:$out\hook-relay.exe" .\HookRelay.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /warn:4 /target:library "/out:$out\BuddyForm.dll" /r:System.Drawing.dll /r:System.Windows.Forms.dll .\BuddyForm.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
