name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run state and installer tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\hooks.ps1

      - name: Build the release package with warnings as errors
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proto/buddy-rs
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests (state machine, quota, updates, relay)
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Relay and installer checks
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\relay-rs.ps1 -Relay .\proto\buddy-rs\target\release\hook-relay.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render snapshots
        if: runner.os == 'macOS'
        run: ./target/release/buddy-host --snapshot "$RUNNER_TEMP/snapshots"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-snapshots
          path: ${{ runner.temp }}/snapshots
